# Tag vX.Y.Z → build the static binary + both-arch ply images, attach to the
# release. The version guard mirrors ply's: a tag that disagrees with the
# manifest publishes a dead URL for consumers.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }

      - name: install ply + tailwind
        run: |
          curl -fsSL https://i.plybox.sh/install.sh | PLY_WIZARD=no sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p bin
          curl -fsSL -o bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x bin/tailwindcss

      - name: version guard
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' ply.toml | head -1)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != ply.toml version v$V"; exit 1; }

      - name: test
        run: make test

      - name: build images (x64 + arm64)
        run: |
          V=${GITHUB_REF_NAME#v}
          make build VERSION=$V
          ply build . --arch x64
          ply build . --arch arm64

      - name: attach to release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dashboard-*-linux-*.img --clobber

      # A runner cannot do the device flow, so it publishes with a key.
      # This is the step that actually SHIPS: every host runs the dashboard
      # from `app = "dashboard"`, which resolves the newest apps/dashboard on
      # each reconcile beat. A release that only reaches GitHub reaches nobody.
      - name: publish to the registry
        env:
          PLY_TOKEN: ${{ secrets.PLY_TOKEN }}
        run: |
          test -n "$PLY_TOKEN" || { echo "::error::PLY_TOKEN secret is not set"; exit 1; }
          # Both shelves while `apps/` is being folded into `ply/`: hosts
          # released before the fold resolve a bare `dashboard` through
          # apps/, hosts after it through ply/. Drop the apps/ line once
          # every host has self-updated past the flip.
          for img in dashboard-*-linux-*.img; do
            echo "==> $img"
            ply push "$img" --as ply
            ply push "$img" --as apps
          done
