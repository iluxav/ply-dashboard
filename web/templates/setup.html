{{define "title"}}ply · setup{{end}}
{{define "crumb"}}first boot{{end}}
{{define "content"}}
<div class="max-w-xs mx-auto mt-16">
  <p class="text-fade/70 text-xs mb-4">first boot — the setup token was printed to this app's log
    (<span class="text-fade">journalctl -u ply-dashboard</span> or <span class="text-fade">ply run</span> output).</p>
  {{with .Error}}<div class="text-red-400 text-xs mb-4 border border-red-900/60 rounded px-3 py-2">{{.}}</div>{{end}}
  <form method="post" action="/setup" class="space-y-3">
    <input name="token" placeholder="setup token" autofocus
           class="w-full bg-card border border-edge rounded px-3 py-2 text-ink placeholder-fade/40 focus:outline-none focus:border-accent">
    <input name="user" placeholder="username" autocomplete="username"
           class="w-full bg-card border border-edge rounded px-3 py-2 text-ink placeholder-fade/40 focus:outline-none focus:border-accent">
    <input name="password" type="password" placeholder="password (8+ chars)" autocomplete="new-password"
           class="w-full bg-card border border-edge rounded px-3 py-2 text-ink placeholder-fade/40 focus:outline-none focus:border-accent">
    <button class="w-full bg-accent text-ground rounded py-2 font-bold hover:bg-accent-bright">create account</button>
  </form>
</div>
{{end}}
