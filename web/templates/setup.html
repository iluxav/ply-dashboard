{{define "title"}}ply · setup{{end}}
{{define "crumb"}}first boot{{end}}
{{define "content"}}
<div class="max-w-xs mx-auto mt-16">
  <p class="text-zinc-500 text-xs mb-4">first boot — the setup token was printed to this app's log
    (<span class="text-zinc-400">journalctl -u ply-dashboard</span> or <span class="text-zinc-400">ply run</span> output).</p>
  {{with .Error}}<div class="text-red-400 text-xs mb-4 border border-red-900/60 rounded px-3 py-2">{{.}}</div>{{end}}
  <form method="post" action="/setup" class="space-y-3">
    <input name="token" placeholder="setup token" autofocus
           class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
    <input name="user" placeholder="username" autocomplete="username"
           class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
    <input name="password" type="password" placeholder="password (8+ chars)" autocomplete="new-password"
           class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
    <button class="w-full bg-zinc-100 text-zinc-950 rounded py-2 font-bold hover:bg-white">create account</button>
  </form>
</div>
{{end}}
